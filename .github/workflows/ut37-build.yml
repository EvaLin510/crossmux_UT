name: UT37 build + web flasher

on:
  workflow_dispatch:
  push:
    branches: ['ut-1.6.0']
    paths: ['src/**', 'lib/**', 'ut37/**', 'platformio.ini', 'freeink-sdk', '.github/workflows/ut37-build.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-ut37-${{ hashFiles('platformio.ini') }}
      - name: Install PlatformIO
        run: pip install platformio
      - name: Show base version
        run: |
          git describe --tags --always || true
          awk '/^\[crosspoint\]/{f=1;next} f&&/^version/{print "crosspoint.version =", $3;exit}' platformio.ini
          git -C freeink-sdk rev-parse HEAD
      - name: Apply UT37 board port
        run: python3 ut37/apply_ut37.py
      - name: Build ut37
        run: pio run -e ut37
      - name: Package web flasher
        run: |
          B=.pio/build/ut37
          BOOT_APP0=$(find ~/.platformio/packages -name boot_app0.bin | head -1)
          VER=$(awk '/^\[crosspoint\]/{f=1;next} f&&/^version/{print $3;exit}' platformio.ini)
          VER=${VER:-dev}
          mkdir -p dist
          python3 scripts/make_flasher_html.py \
            --bootloader $B/bootloader.bin --partitions $B/partitions.bin \
            --boot-app0 "$BOOT_APP0" --app $B/firmware.bin \
            --title "UT37 CrossMux $VER" --out dist/UT37-Flasher.html
          cp $B/firmware.bin dist/UT37-firmware-app.bin
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: UT37-Flasher
          path: dist/
