
; --- UT37 — 3.7" 240x416 UC8253, ESP32-S3R8 (16MB flash / 8MB OPI PSRAM) ------
; Murphy-family variant (UC8253 driver) with its own BoardConfig profile.
; Pins: ut37/PINS.md. Touch: FT6336U at 0x40. RTC: RX8025T. AHT30 has no driver yet.
[ut37_hardware]
extends = base
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
board_build.arduino.memory_type = dio_opi
lib_deps =
  ${s3_ble_psram.lib_deps}
  Buzzer=symlink://freeink-sdk/libs/hardware/Buzzer
extra_scripts =
  ${s3_ble_psram.extra_scripts}
  pre:scripts/build_epoch.py
build_flags =
  ${base.build_flags}
  ${s3_ble_psram.build_flags}
  -DFREEINK_DEVICE_MURPHY=1
  -DFREEINK_DEVICE_UT37=1
  -DFREEINK_CAP_AUDIO=0
  -DFREEINK_CAP_TOUCH=1
  -DFREEINK_SD_SDMMC=1
  ; RX8025T RTC at 0x32. The GPIO18 buzzer (FREEINK_CAP_BUZZER via MURPHY) is a dev prompt only.
  -DFREEINK_CAP_RTC=1
  -DBOARD_HAS_PSRAM
  -DUSB_PRODUCT=\"UT37-CrossMux\"
  -DUSB_MANUFACTURER=\"CrossMux\"
  -DUSE_BLOCK_DEVICE_INTERFACE=1

[env:ut37]
extends = ut37_hardware
build_flags =
  ${ut37_hardware.build_flags}
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-ut37\"
  -DENABLE_SERIAL_LOG
  ; HWCDC operator bool reads false on USB-Serial-JTAG, dropping logs; use the ROM console like Sticky.
  -DFREEINK_LOG_TRANSPORT=2
  -DLOG_LEVEL=2
